name: Research evidence
description: Share a versioned proof package and its verification evidence.
title: "[Research evidence] "
body:
  - type: markdown
    attributes:
      value: |
        This submission and the source you link are public. Specify the exact theorem statements, assumptions and dependency pins. A leaderboard entry requires an official verification of the unconditional competition statements.
  - type: input
    id: score
    attributes:
      label: Exact rational bound
      placeholder: numerator / denominator
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Immutable source
      description: Link to a public repository at a full commit SHA or a downloadable source archive with its SHA-256 digest.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Proof and reproduction
      description: Give the solution path, method, dependency commits, attribution, license, and any replay instructions or logs.
    validations:
      required: true
