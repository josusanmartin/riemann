name: Build E2B verifier template

on:
  workflow_dispatch:

concurrency:
  group: e2b-verifier-template
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build pinned no-egress verifier image
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: npm run e2b:template:build
