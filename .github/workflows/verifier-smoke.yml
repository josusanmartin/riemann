name: Verifier smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verifier-smoke.yml"
      - "challenge/**"
      - "scripts/install-lean-toolchain.sh"
      - "scripts/install-verifier-tools.sh"
      - "scripts/run-comparator-sandbox.sh"
      - "scripts/smoke-verifier.sh"
      - "scripts/verify-submission.ts"
  pull_request:
    paths:
      - ".github/workflows/verifier-smoke.yml"
      - "challenge/**"
      - "scripts/install-lean-toolchain.sh"
      - "scripts/install-verifier-tools.sh"
      - "scripts/run-comparator-sandbox.sh"
      - "scripts/smoke-verifier.sh"
      - "scripts/verify-submission.ts"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned Lean toolchain manager
        run: ./scripts/install-lean-toolchain.sh

      - name: Install pinned formal verifier
        run: ./scripts/install-verifier-tools.sh "$RUNNER_TEMP/riemann-tools"

      - name: Replay a known proof through both kernels
        run: ./scripts/smoke-verifier.sh "$RUNNER_TEMP/riemann-tools"
