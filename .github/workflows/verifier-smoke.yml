name: Verifier smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pinned Lean toolchain manager
        run: ./scripts/install-lean-toolchain.sh

      - name: Install pinned formal verifier
        run: ./scripts/install-verifier-tools.sh "$RUNNER_TEMP/riemann-tools"

      - name: Replay a known proof through both kernels
        run: ./scripts/smoke-verifier.sh "$RUNNER_TEMP/riemann-tools"
