name: Verifier smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verifier-smoke.yml"
      - "challenge/**"
      - "boat/compact/**"
      - "scripts/install-lean-toolchain.sh"
      - "scripts/install-native-build-toolchains.sh"
      - "scripts/install-verifier-tools.sh"
      - "scripts/run-comparator-sandbox.sh"
      - "scripts/smoke-verifier.sh"
      - "scripts/verify-submission.ts"
  pull_request:
    paths:
      - ".github/workflows/verifier-smoke.yml"
      - "challenge/**"
      - "boat/compact/**"
      - "scripts/install-lean-toolchain.sh"
      - "scripts/install-native-build-toolchains.sh"
      - "scripts/install-verifier-tools.sh"
      - "scripts/run-comparator-sandbox.sh"
      - "scripts/smoke-verifier.sh"
      - "scripts/verify-submission.ts"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Replay accepted and rejected controls through the compact worker
        run: |
          set -euo pipefail
          sudo bash boat/compact/install-toolchain.sh /opt/lean435
          sudo install -d /opt/riemann-controls
          sudo cp -R boat/compact /opt/riemann-controls/
          sudo useradd --create-home --shell /usr/sbin/nologin proofcheck
          sudo useradd --create-home --shell /usr/sbin/nologin referee
          sudo env PATH=/opt/lean435/bin:/usr/bin:/bin bash /opt/riemann-controls/compact/control.sh
