name: Generate one-band D-window seam

on:
  push:
    branches: ["research/zeta-two-band-ci"]
    paths:
      - ".github/workflows/zeta-generate-one-band-seam.yml"
      - "research/zeta-two-band-ci/generate_one_band_seam.py"
      - "research/zeta-two-band-ci/TwoBandGapMatchingD.lean"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/zeta-two-band-ci
          fetch-depth: 0
      - name: Generate seam
        run: python3 research/zeta-two-band-ci/generate_one_band_seam.py
      - name: Commit generated Lean source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/zeta-two-band-ci/OneBandGapMatchingD.lean
          git commit -m 'research: generate one-band D-window seam' || exit 0
          git pull --rebase origin research/zeta-two-band-ci
          git push origin HEAD:research/zeta-two-band-ci
