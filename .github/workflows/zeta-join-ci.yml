name: Zeta one-band join CI

on:
  push:
    branches: ["research/zeta-two-band-ci"]
    paths:
      - ".github/workflows/zeta-join-ci.yml"
      - "research/zeta-join-ci/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Lean
        run: ./scripts/install-lean-toolchain.sh >/dev/null
      - name: Prepare project
        run: |
          git clone -q https://github.com/m0at/zeta-23-lean.git "$RUNNER_TEMP/zeta23"
          cd "$RUNNER_TEMP/zeta23"
          git checkout -q a6bcd8a58fc9c95615fde8594c06c543fd979641
          GAP="$RUNNER_TEMP/zeta23/Zeta23/GapMatching"
          cp "$GITHUB_WORKSPACE/research/zeta-two-band-ci/FiniteStateGapPotential.lean" "$GAP/FiniteStateGapPotential.lean"
          cp "$GITHUB_WORKSPACE/research/zeta-two-band-ci/OneBandPotentialSafeNumerics.lean" "$GAP/OneBandPotentialSafeNumerics.lean"
          cp "$GITHUB_WORKSPACE/research/zeta-join-ci/OneBandGapWord.lean" "$GAP/OneBandGapWord.lean"
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "zeta23/Zeta23/GapMatching/OneBandPotentialSafeNumerics.lean"
          s = p.read_text()
          old = '''def transitionFloor (previous current : State) : ℝ :=
            B * lengthFloor current
              + shortFloor current
              + longFloor previous current
              + phi previous - phi current'''
          new = '''def physicalFloor (previous current : State) : ℝ :=
            B * lengthFloor current
              + shortFloor current
              + longFloor previous current

          def transitionFloor (previous current : State) : ℝ :=
            physicalFloor previous current + phi previous - phi current'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''norm_num [A, B, p, j, badLeft, transitionFloor,
                lengthFloor, shortFloor, longFloor, phi]'''
          new = '''norm_num [A, B, p, j, badLeft, transitionFloor,
                physicalFloor, lengthFloor, shortFloor, longFloor, phi]'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''theorem localCertificate_of_dominates
              (previous : State) (g : GapDatum State)
              (h : transitionFloor previous g.state
                ≤ stepCost B State.good previous g) :
              LocalCertificate A B State.good phi previous g :=
            (transition_certificate previous g.state).trans h'''
          new = '''theorem localCertificate_of_dominates
              (previous : State) (g : GapDatum State)
              (h : physicalFloor previous g.state
                ≤ stepCost B State.good previous g) :
              LocalCertificate A B State.good phi previous g := by
            unfold LocalCertificate
            calc
              A ≤ transitionFloor previous g.state :=
                transition_certificate previous g.state
              _ = physicalFloor previous g.state
                    + phi previous - phi g.state := rfl
              _ ≤ stepCost B State.good previous g
                    + phi previous - phi g.state := by
                nlinarith'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Restore cache quietly
        working-directory: ${{ runner.temp }}/zeta23
        run: lake exe cache get >/dev/null
      - name: Compile join module with concise diagnostics
        working-directory: ${{ runner.temp }}/zeta23
        run: |
          set +e
          lake build Zeta23.GapMatching.OneBandGapWord > /tmp/join.log 2>&1
          status=$?
          echo '=== JOIN ERRORS ==='
          grep -n -A18 -B4 'error:' /tmp/join.log || true
          echo '=== JOIN LOG TAIL ==='
          tail -n 30 /tmp/join.log
          exit $status
