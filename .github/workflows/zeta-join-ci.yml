name: Zeta one-band join CI

on:
  push:
    branches: ["research/zeta-two-band-ci"]
    paths:
      - ".github/workflows/zeta-join-ci.yml"
      - "research/zeta-join-ci/**"
      - "research/zeta-two-band-ci/OneBandPotentialSafeNumerics.lean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Lean
        run: ./scripts/install-lean-toolchain.sh >/dev/null
      - name: Prepare project
        run: |
          git clone -q https://github.com/m0at/zeta-23-lean.git "$RUNNER_TEMP/zeta23"
          cd "$RUNNER_TEMP/zeta23"
          git checkout -q a6bcd8a58fc9c95615fde8594c06c543fd979641
          GAP="$RUNNER_TEMP/zeta23/Zeta23/GapMatching"
          cp "$GITHUB_WORKSPACE/research/zeta-two-band-ci/FiniteStateGapPotential.lean" "$GAP/FiniteStateGapPotential.lean"
          cp "$GITHUB_WORKSPACE/research/zeta-two-band-ci/FiniteStatePathWeight.lean" "$GAP/FiniteStatePathWeight.lean"
          cp "$GITHUB_WORKSPACE/research/zeta-two-band-ci/OneBandPotentialSafeNumerics.lean" "$GAP/OneBandPotentialSafeNumerics.lean"
          cp "$GITHUB_WORKSPACE/research/zeta-join-ci/OneBandGapWord.lean" "$GAP/OneBandGapWord.lean"
          cp "$GITHUB_WORKSPACE/research/zeta-join-ci/OneBandPathWeightIdentity.lean" "$GAP/OneBandPathWeightIdentity.lean"
          cp "$GITHUB_WORKSPACE/research/zeta-join-ci/OneBandFixedHeightBonus.lean" "$GAP/OneBandFixedHeightBonus.lean"
      - name: Restore cache quietly
        working-directory: ${{ runner.temp }}/zeta23
        run: lake exe cache get >/dev/null
      - name: Compile join modules with concise diagnostics
        working-directory: ${{ runner.temp }}/zeta23
        run: |
          set +e
          lake build Zeta23.GapMatching.OneBandFixedHeightBonus > /tmp/join.log 2>&1
          status=$?
          echo '=== JOIN ERRORS ==='
          grep -n -A20 -B5 'error:' /tmp/join.log || true
          echo '=== JOIN LOG TAIL ==='
          tail -n 50 /tmp/join.log
          exit $status