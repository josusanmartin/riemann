name: Decode one-band profile source

on:
  push:
    branches: ["research/zeta-two-band-ci"]
    paths:
      - ".github/workflows/zeta-profile-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/zeta-two-band-ci
          fetch-depth: 0
      - name: Decode source
        run: |
          base64 -d research/zeta-two-band-ci/OneBandSharpProfile.lean.gz.b64 \
            | gzip -d > research/zeta-two-band-ci/OneBandSharpProfile.lean
          echo '=== line count ==='
          wc -l research/zeta-two-band-ci/OneBandSharpProfile.lean
          echo '=== declarations ==='
          grep -nE '^(private )?(def|abbrev|structure|lemma|theorem) ' \
            research/zeta-two-band-ci/OneBandSharpProfile.lean || true
      - name: Commit decoded source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/zeta-two-band-ci/OneBandSharpProfile.lean
          git commit -m 'research: retain decoded one-band profile source' || exit 0
          git pull --rebase origin research/zeta-two-band-ci
          git push origin HEAD:research/zeta-two-band-ci
