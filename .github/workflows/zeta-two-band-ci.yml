name: Zeta two-band research CI

on:
  push:
    branches: ["research/zeta-two-band-ci"]
    paths:
      - ".github/workflows/zeta-two-band-ci.yml"
      - "research/zeta-two-band-ci/**"

concurrency:
  group: zeta-two-band-research-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Lean toolchain manager
        run: ./scripts/install-lean-toolchain.sh

      - name: Check out the gap-matching research base
        run: |
          git clone https://github.com/m0at/zeta-23-lean.git "$RUNNER_TEMP/zeta23"
          cd "$RUNNER_TEMP/zeta23"
          git checkout a6bcd8a58fc9c95615fde8594c06c543fd979641

      - name: Add the two-band prototype modules
        run: |
          cp research/zeta-two-band-ci/FiniteStateGapPotential.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/FiniteStateGapPotential.lean"
          cp research/zeta-two-band-ci/FiniteStatePathWeight.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/FiniteStatePathWeight.lean"
          cp research/zeta-two-band-ci/TwoBandPotentialSafeNumerics.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/TwoBandPotentialSafeNumerics.lean"
          cp research/zeta-two-band-ci/TwoBandPotentialOverlap.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/TwoBandPotentialOverlap.lean"
          cp research/zeta-two-band-ci/TwoBandPotentialAnalyticBridge.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/TwoBandPotentialAnalyticBridge.lean"
          cp research/zeta-two-band-ci/CandidateStrictImprovement.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/CandidateStrictImprovement.lean"
          cp research/zeta-two-band-ci/v7/DNormalizedMoments.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/DNormalizedMoments.lean"
          cp research/zeta-two-band-ci/v7/ScalarBonusCertificate.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/ScalarBonusCertificate.lean"
          cp research/zeta-two-band-ci/TwoBandGapMatchingD.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/TwoBandGapMatchingD.lean"
          cp research/zeta-two-band-ci/TwoBandGapMatchingDPath.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/TwoBandGapMatchingDPath.lean"
          cp research/zeta-two-band-ci/CentralPathConstructionD.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/CentralPathConstructionD.lean"
          cp research/zeta-two-band-ci/GuardedWindowCount.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/GuardedWindowCount.lean"
          cp research/zeta-two-band-ci/CentralGuardCountD.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/CentralGuardCountD.lean"
          cp research/zeta-two-band-ci/OrderedPointGaps.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/OrderedPointGaps.lean"
          cp research/zeta-two-band-ci/DWindowLength.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/DWindowLength.lean"
          cp research/zeta-two-band-ci/CentralGapGeometryD.lean \
            "$RUNNER_TEMP/zeta23/Zeta23/GapMatching/CentralGapGeometryD.lean"
          python3 research/zeta-two-band-ci/patch_ci_sources.py "$RUNNER_TEMP/zeta23"

      - name: Restore Mathlib cache
        working-directory: ${{ runner.temp }}/zeta23
        run: |
          for attempt in 1 2 3 4; do
            if lake exe cache get; then
              exit 0
            fi
            echo "Mathlib cache attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Compile the prototype
        working-directory: ${{ runner.temp }}/zeta23
        run: |
          set -o pipefail
          lake build \
            Zeta23.GapMatching.FiniteStateGapPotential \
            Zeta23.GapMatching.FiniteStatePathWeight \
            Zeta23.GapMatching.TwoBandPotentialSafeNumerics \
            Zeta23.GapMatching.TwoBandPotentialOverlap \
            Zeta23.GapMatching.TwoBandPotentialAnalyticBridge \
            Zeta23.GapMatching.CandidateStrictImprovement \
            Zeta23.GapMatching.DNormalizedMoments \
            Zeta23.GapMatching.ScalarBonusCertificate \
            Zeta23.GapMatching.TwoBandGapMatchingD \
            Zeta23.GapMatching.TwoBandGapMatchingDPath \
            Zeta23.GapMatching.CentralPathConstructionD \
            Zeta23.GapMatching.GuardedWindowCount \
            Zeta23.GapMatching.CentralGuardCountD \
            Zeta23.GapMatching.OrderedPointGaps \
            Zeta23.GapMatching.DWindowLength \
            Zeta23.GapMatching.CentralGapGeometryD \
            2>&1 | tee "$RUNNER_TEMP/zeta-two-band-build.log"